name: Build OTClient WASM

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout war-client
        uses: actions/checkout@v4
        with:
          path: war-client

      - name: Clone OTClientV8 engine
        run: git clone https://github.com/OTAcademy/otclientv8.git engine

      - name: Apply WASM patches
        run: |
          cp war-client/.github/patches/root-CMakeLists.txt engine/CMakeLists.txt
          cp war-client/.github/patches/framework-CMakeLists.txt engine/src/framework/CMakeLists.txt
          cp war-client/.github/patches/lbitlib.cpp engine/src/framework/luaengine/lbitlib.cpp
          cp war-client/.github/patches/luavaluecasts.h engine/src/framework/luaengine/luavaluecasts.h
          cp war-client/.github/patches/point.h engine/src/framework/util/point.h
          cp war-client/.github/patches/wasmplatform.cpp engine/src/framework/platform/wasmplatform.cpp

      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-3.1.73

      - name: Install emsdk 3.1.73
        run: |
          if [ ! -f emsdk/emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install 3.1.73
          ./emsdk activate 3.1.73

      - name: Cache PhysFS build
        uses: actions/cache@v4
        with:
          path: physfs-build
          key: physfs-wasm-emsdk3173-v1

      - name: Build PhysFS for WASM
        run: |
          source emsdk/emsdk_env.sh
          if [ ! -f physfs-build/libphysfs.a ]; then
            git clone https://github.com/icculus/physfs.git physfs-src
            mkdir -p physfs-build
            cd physfs-build
            emcmake cmake ../physfs-src \
              -DPHYSFS_BUILD_SHARED=OFF \
              -DPHYSFS_BUILD_TEST=OFF \
              -DPHYSFS_BUILD_DOCS=OFF
            emmake make -j2
          fi

      - name: Download Lua 5.1.5
        run: |
          if [ ! -d lua-lua-5.1 ]; then
            wget -q http://www.lua.org/ftp/lua-5.1.5.tar.gz
            tar xzf lua-5.1.5.tar.gz
            mv lua-5.1.5 lua-lua-5.1
          fi

      - name: Set build paths in CMakeLists
        run: |
          PHYSFS_LIB=$(pwd)/physfs-build/libphysfs.a
          PHYSFS_SRC=$(pwd)/physfs-src/src
          LUA_DIR=$(pwd)/lua-lua-5.1
          LUA_SRC_DIR=$(pwd)/lua-lua-5.1/src
          sed -i "s|\${PHYSFS_LIB}|$PHYSFS_LIB|g" engine/src/framework/CMakeLists.txt
          sed -i "s|\${PHYSFS_SRC}|$PHYSFS_SRC|g" engine/src/framework/CMakeLists.txt
          sed -i "s|\${LUA_DIR}\"|$LUA_DIR\"|g" engine/src/framework/CMakeLists.txt
          sed -i "s|\${LUA_SRC_DIR}|$LUA_SRC_DIR|g" engine/src/framework/CMakeLists.txt

      - name: Configure WASM build
        run: |
          source emsdk/emsdk_env.sh
          mkdir -p engine/build-wasm
          cd engine/build-wasm
          emcmake cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$(pwd)/../../emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build WASM (single thread to save memory)
        run: |
          source emsdk/emsdk_env.sh
          cd engine/build-wasm
          cmake --build . --target otclient -j2 2>&1 | tee build.log
          echo "Build exit code: $?"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otclient-noobwar-wasm
          path: |
            engine/build-wasm/otclient.js
            engine/build-wasm/otclient.wasm
          retention-days: 30

      - name: Deploy to VPS
        if: success()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "$VPS_SSH_KEY" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          scp -i /tmp/vps_key -o StrictHostKeyChecking=no \
            engine/build-wasm/otclient.js \
            root@$VPS_HOST:/var/www/html_war/play/otclient-noobwar.js
          scp -i /tmp/vps_key -o StrictHostKeyChecking=no \
            engine/build-wasm/otclient.wasm \
            root@$VPS_HOST:/var/www/html_war/play/otclient-noobwar.wasm
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no root@$VPS_HOST \
            "chown www-data:www-data /var/www/html_war/play/otclient-noobwar.js /var/www/html_war/play/otclient-noobwar.wasm && sed -i 's/noobwar-v[0-9.]*/noobwar-v1.0.5/' /var/www/html_war/play/sw.js"
          rm -f /tmp/vps_key
